name: Daily update
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 update.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "examdaily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Daily data update"
          git push
