name: Site health
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check files
        id: f
        run: python3 health_check.py files
        continue-on-error: true
      - name: Check live site (daily or manual)
        id: l
        if: github.event_name != 'push'
        run: python3 health_check.py live
        continue-on-error: true
      - name: Open an issue if broken
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f health_report.md ]; then
            gh issue create --title "Site check failed $(date -u +%Y-%m-%d)" --body-file health_report.md
          fi
